name: CI

# All logic lives in bin/ci-check (no private address in a file, unit tests, typecheck, the licence
# gate, the e2e journeys in the pinned Playwright image, the licence of every file), so a job
# only checks out and calls it. The parts of the check run side by side, a job each: one after
# the other they took 17 to 20 minutes (2026-11-26). It needs Docker. A commit on main whose
# every part is green then goes to Cloudflare, as the app without a server (the job `deploy`).
on:
  push:
    branches: [main]
  pull_request:
  # By hand, on main: the check and the deployment once more, without a new commit.
  workflow_dispatch:

# A newer commit supersedes older PR validation; keep main pushes independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-check:
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every part says how it went: one that fails does not stop the others.
      fail-fast: false
      matrix:
        # The parts of bin/ci-check: what is no journey, and the journeys of each browser.
        part: [unit, chromium, webkit, tablet, browser-only]
    env:
      # The image a job builds in one step and checks with in the next: one of its own, also
      # where the jobs of a run share a machine.
      DRILLGRAM_CI_IMAGE: drillgram-ci-${{ github.run_id }}-${{ matrix.part }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true # packages/layout is the engine's own repository
      # Two steps, so that a run says how long each took and which of them failed.
      - name: Build the check's image
        run: bin/ci-check image
      - name: Check
        run: bin/ci-check ${{ matrix.part }}
      # A runner that is not thrown away after the job keeps its Docker build cache, and nothing
      # else takes it away: every build adds layers until the disk is full and no job can start.
      # So the job's image goes, and what no build used for 6 hours, after every check, and the
      # log says what uses the disk. GitHub's own runners start fresh each time.
      - name: Free the image and the build cache nothing used for 6 hours
        if: always() && github.server_url != 'https://github.com'
        run: |
          docker rmi -f "$DRILLGRAM_CI_IMAGE" || true
          docker builder prune --all --force --filter until=6h | tail -n 1
          docker system df

  # The app without a server, to Cloudflare (context/operations.md, "Without a server"): what
  # `mise run cloudflare` does on a machine. Only for main, only after its check, and only in
  # the repository that has the two secrets: a fork deploys nothing until its owner names it
  # here and gives it secrets of its own.
  deploy:
    needs: ci-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'mafigit/drillgram'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deployment at a time, and none stopped half-way.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # The tools of mise.toml but Go: the server is not built here.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm rust
      - run: mise run cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
