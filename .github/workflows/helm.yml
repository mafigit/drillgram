name: Hosted Helm chart

on:
  pull_request:
    paths:
      - .github/workflows/helm.yml
      - bin/helm-check
      - deploy/helm/**
      - Dockerfile
      - .dockerignore
  push:
    branches: [main]
    paths:
      - .github/workflows/helm.yml
      - bin/helm-check
      - deploy/helm/**
      - Dockerfile
      - .dockerignore
    tags: ['helm-v*']

permissions:
  contents: read

env:
  HELM_VERSION: '3.21.4'
  KIND_VERSION: '0.33.0'
  KUBECTL_VERSION: '1.37.1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: helm@${{ env.HELM_VERSION }} kind@${{ env.KIND_VERSION }} kubectl@${{ env.KUBECTL_VERSION }}
      - name: Package the chart
        run: |
          set -euo pipefail
          chart=deploy/helm/drillgram
          staging=$(mktemp -d)
          cp -r "$chart" "$staging/"
          cp LICENSE "$staging/drillgram/"
          mkdir -p dist
          mise exec "helm@$HELM_VERSION" -- helm package "$staging/drillgram" --destination dist
      - name: Test both database modes on Kubernetes
        run: |
          docker build --provenance=false -t drillgram:helm-test .
          mise exec "helm@$HELM_VERSION" "kind@$KIND_VERSION" "kubectl@$KUBECTL_VERSION" -- bash -c '
            set -euo pipefail
            kind create cluster --wait 2m
            kind load docker-image drillgram:helm-test
            bin/helm-check dist/drillgram-*.tgz
          '
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/drillgram-*.tgz
          if-no-files-found: error

  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/helm-v') && github.repository == 'mafigit/drillgram'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/mafigit/drillgram
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Verify the release version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=${GITHUB_REF_NAME#helm-v}
          grep -Fx "version: $version" deploy/helm/drillgram/Chart.yaml
          grep -Fx "appVersion: \"$version\"" deploy/helm/drillgram/Chart.yaml
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: helm-chart
          path: dist
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Publish the hosted image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" --push .
      - name: Publish the Helm chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Hosted image: `%s:%s`\n\nInstall the chart with [the Helm guide](%s/%s/blob/%s/deploy/helm/drillgram/README.md).\n' \
            "$IMAGE" "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/drillgram-$VERSION.tgz" --verify-tag \
            --title "Drillgram Helm $VERSION" --notes-file release-notes.md
