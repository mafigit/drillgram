name: Hosted Helm chart

# The chart is packaged and tested on Kubernetes (its Chainsaw tests on kind, both database
# modes) when it or the image's build changes. A release (the hosted image on GitHub Container Registry, the chart on GitHub
# Releases) comes by itself: CI calls this workflow after every green commit on main
# (`release: true`), and the job `version` says from the commits since the last `helm-v` tag
# which version is next (deploy/release): a feature a minor one, a fix a patch, nothing for
# tests, docs or chores. A `helm-v<version>` tag pushed by hand still releases that version.
on:
  pull_request:
    paths:
      - .github/workflows/helm.yml
      - bin/helm-check
      - deploy/helm/**
      - Dockerfile
      - .dockerignore
  push:
    branches: [main]
    paths:
      - .github/workflows/helm.yml
      - bin/helm-check
      - deploy/helm/**
      - Dockerfile
      - .dockerignore
    tags: ['helm-v*']
  workflow_call:
    inputs:
      release:
        description: Release the commit if its changes since the last release call for one
        type: boolean
        default: false

permissions:
  contents: read

env:
  HELM_VERSION: '3.21.4'
  KIND_VERSION: '0.33.0'
  KUBECTL_VERSION: '1.37.1'
  CHAINSAW_VERSION: '0.2.15'

jobs:
  # Which version to release: that of a pushed tag, or the next one after the last tag. Empty
  # when the commits since then make no release. Not asked on a check of a change to the chart.
  version:
    if: inputs.release || startsWith(github.ref, 'refs/tags/helm-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the tags and the commits since the last one
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node
      - id: next
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/helm-v* ]]; then
            version=${GITHUB_REF_NAME#helm-v}
          else
            version=$(node deploy/release/src/cli.ts)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: ${version:-none, no feature or fix since the last one}" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: version
    # On a check of the chart `version` is skipped; for a release, only when there is one.
    if: ${{ !cancelled() && (needs.version.result == 'skipped' || needs.version.outputs.version != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: helm@${{ env.HELM_VERSION }} kind@${{ env.KIND_VERSION }} kubectl@${{ env.KUBECTL_VERSION }} aqua:kyverno/chainsaw@${{ env.CHAINSAW_VERSION }}
      # A release is packaged as its version, which is also the image's tag (appVersion);
      # Chart.yaml's own is for checks only.
      - name: Package the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          chart=deploy/helm/drillgram
          staging=$(mktemp -d)
          cp -r "$chart" "$staging/"
          cp LICENSE "$staging/drillgram/"
          mkdir -p dist
          as=()
          if [ -n "$VERSION" ]; then as=(--version "$VERSION" --app-version "$VERSION"); fi
          mise exec "helm@$HELM_VERSION" -- helm package "$staging/drillgram" --destination dist "${as[@]}"
      # The image is built with a builder that keeps its layers in GitHub's cache, as in CI
      # (ci.yml): the job `publish` takes them from there. Its stages build on the runner's
      # platform for every target (Dockerfile), so for the release only arm64's `go build` is left.
      - name: Let the build reach GitHub's cache
        uses: actions/github-script@v9
        with:
          script: |
            for (const [name, value] of Object.entries(process.env)) {
              if (name.startsWith('ACTIONS_')) core.exportVariable(name, value)
            }
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        run: |
          docker buildx build --provenance=false --load -t drillgram:helm-test \
            --cache-from type=gha,scope=image \
            --cache-to type=gha,scope=image,mode=max,ignore-error=true .
      # The chart's Chainsaw tests (deploy/helm/tests) on kind: rendering, both database modes.
      - name: Test the chart on Kubernetes
        run: |
          mise exec "helm@$HELM_VERSION" "kind@$KIND_VERSION" "kubectl@$KUBECTL_VERSION" "aqua:kyverno/chainsaw@$CHAINSAW_VERSION" -- bash -c '
            set -euo pipefail
            kind create cluster --wait 2m
            kind load docker-image drillgram:helm-test
            bin/helm-check dist/drillgram-*.tgz
          '
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/drillgram-*.tgz
          if-no-files-found: error

  publish:
    needs: [version, smoke]
    if: ${{ !cancelled() && needs.smoke.result == 'success' && needs.version.outputs.version != '' && github.repository == 'mafigit/drillgram' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/mafigit/drillgram
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Release only what is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v8
        with:
          name: helm-chart
          path: dist
      - name: Let the build reach GitHub's cache
        uses: actions/github-script@v9
        with:
          script: |
            for (const [name, value] of Object.entries(process.env)) {
              if (name.startsWith('ACTIONS_')) core.exportVariable(name, value)
            }
      # No emulation: every stage that builds runs on amd64, arm64's server is cross-compiled.
      - uses: docker/setup-buildx-action@v4
      - name: Publish the hosted image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --cache-from type=gha,scope=image \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" --push .
      # The tag is made here for a release CI asked for. The notes list its features and fixes.
      # The chart goes up twice: under its version, and as drillgram.tgz, which the address of
      # the latest release (releases/latest/download/drillgram.tgz) always finds.
      - name: Publish the Helm chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="helm-v$VERSION"
          last=$(git describe --tags --abbrev=0 --match 'helm-v*' --exclude "$tag" HEAD 2>/dev/null || true)
          {
            printf 'Hosted image: `%s:%s`\n\n' "$IMAGE" "$VERSION"
            printf 'Install the chart with [the Helm guide](%s/%s/blob/%s/deploy/helm/drillgram/README.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag"
            changes=$(git log --format='- %s' ${last:+"$last..HEAD"} | grep -E '^- (feat|fix|perf)(\([^)]*\))?!?:' || true)
            if [ -n "$changes" ]; then printf '\n## Changes\n\n%s\n' "$changes"; fi
          } > release-notes.md
          cp "dist/drillgram-$VERSION.tgz" dist/drillgram.tgz
          gh release create "$tag" "dist/drillgram-$VERSION.tgz" dist/drillgram.tgz --target "$GITHUB_SHA" \
            --title "Drillgram Helm $VERSION" --notes-file release-notes.md
